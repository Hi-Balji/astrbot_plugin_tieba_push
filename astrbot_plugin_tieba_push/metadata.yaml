name: astrbot_plugin_tieba_push
display_name: 贴吧定时推送
desc: 定时抓取指定贴吧的热门图文帖推送到白名单群聊。每个图文帖一条合并转发(标题+图片),视频帖直发;图片优先直取原图(免登录);管理员可手动触发。
help: |
  定时推送:每天在配置的多个时间点,抓取各贴吧热门帖(默认:搬石/核战避难所/地狱笑话/吊图,每个吧2条),推送到白名单群。
  发送规则:每个图文帖一条合并转发(内容=标题+图片,不显示吧名/作者);视频帖单独直发(标题+视频同一条);图片优先直取原图。
  只推带图/带视频帖;已推送过的帖子自动去重。
  手动触发(仅管理员):/贴吧推送  或  /贴吧推送 <吧名>
  Cookie检验(仅管理员):/贴吧cookie测试
version: 1.4.5
author: Balji
repo: https://github.com/balji/astrbot_plugin_tieba_push
